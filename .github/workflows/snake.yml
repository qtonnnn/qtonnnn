name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: qtonnnn
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg

      - name: Push snake to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/qtonnnn/qtonnnn.git" repo
          cd repo
          git checkout output || git checkout -b output
          mkdir -p .
          cp -r ../dist/* .
          git add .
          git commit -m "chore: regenerate snake SVG" || echo "nothing to commit"
          git push origin output
