name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: qtonnnn
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg

      - name: Push snake to output branch
        run: |
          set -e
          git clone --depth 1 --branch main https://x-access-token:${GITHUB_TOKEN}@github.com/qtonnnn/qtonnnn.git repo
          cd repo
          git checkout -B output origin/output 2>/dev/null || git checkout -b output
          cp -f ../dist/github-contribution-grid-snake.svg .
          cp -f ../dist/github-contribution-grid-snake-dark.svg .
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: regenerate snake SVG" || echo "no changes"
          git push origin output
